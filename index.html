<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>守灵值班报名</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f7f6f4;--card:#ffffff;--border:#e4e2de;
    --text:#1a1916;--sub:#6b6960;--muted:#b0ada6;
    --taken:#d4edda;--taken-text:#1a6335;--taken-border:#98d3aa;
    --accent:#2563eb;--accent-bg:#eff6ff;--radius:10px;
    --period-bg:#efefed;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#141412;--card:#1e1d1b;--border:#2e2d2a;
    --text:#f0ede8;--sub:#8a8880;--muted:#5a5855;
    --taken:#0f2e1a;--taken-text:#6ee09a;--taken-border:#1e5c35;
    --accent:#60a5fa;--accent-bg:#1e3a5f;--period-bg:#1a1918;
  }}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;font-size:15px;min-height:100dvh}

  header{padding:18px 16px 12px;border-bottom:1px solid var(--border);background:var(--card)}
  .header-en{font-size:13px;font-weight:500;color:var(--sub)}
  .header-zh{font-size:22px;font-weight:600;margin:2px 0 5px}
  .header-subs{font-size:13px;color:var(--sub);line-height:1.6}

  .sync-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s}
  .dot.ok{background:#22c55e}.dot.err{background:#ef4444}.dot.loading{background:#f59e0b;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .refresh-btn{margin-left:auto;cursor:pointer;color:var(--accent)}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  table{border-collapse:collapse;width:100%;min-width:680px}
  thead th{background:var(--card);border:1px solid var(--border);padding:10px 6px;text-align:center;position:sticky;top:0;z-index:10}
  thead th.time-col{width:80px;min-width:80px;background:var(--card)}
  .th-zh{font-size:14px;font-weight:600;color:var(--text)}
  .th-en{font-size:11px;color:var(--muted);margin-top:1px}
  .th-date{font-size:16px;font-weight:700;margin-top:2px}
  .th-count{font-size:11px;color:var(--muted);margin-top:2px;min-height:14px}

  tr.period-row td{background:var(--period-bg);border:1px solid var(--border);padding:5px 8px;font-size:12px;font-weight:600;color:var(--sub)}
  tr.period-row td.period-zh{font-size:13px;font-weight:700;color:var(--sub)}
  tr.period-row td span{display:block;font-size:11px;color:var(--muted);font-weight:400}

  tr.slot-row td{border:1px solid var(--border);height:54px;vertical-align:middle;padding:0}
  td.time-cell{padding:0 8px;text-align:right;background:var(--card);position:sticky;left:0;z-index:1}
  .time-zh{font-size:13px;font-weight:600;color:var(--sub)}
  .time-en{font-size:11px;color:var(--muted);margin-top:1px}

  td.slot-cell{cursor:pointer;background:var(--card);transition:background 0.1s;padding:6px 8px;vertical-align:middle}
  td.slot-cell:active{background:var(--accent-bg)}
  td.slot-cell.taken{background:var(--taken)}
  .slot-add{font-size:12px;color:var(--muted)}
  .slot-name-row{display:flex;align-items:center;gap:4px;margin-bottom:2px}
  .slot-name-row:last-child{margin-bottom:0}
  .slot-name-text{font-size:13px;font-weight:600;color:var(--taken-text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .remove-btn{flex-shrink:0;font-size:11px;color:#ef4444;cursor:pointer;padding:1px 5px;border-radius:4px;border:1px solid #ef4444;background:none;line-height:1.6;white-space:nowrap}
  .remove-btn:active{opacity:0.7}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  @media(min-width:480px){.overlay{align-items:center}}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:24px 24px 40px;width:100%;max-width:480px}
  @media(min-width:480px){.sheet{border-radius:20px;padding:28px}}
  .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 20px}
  @media(min-width:480px){.sheet-handle{display:none}}
  .sheet-en{font-size:13px;color:var(--sub);margin-bottom:2px}
  .sheet-zh{font-size:20px;font-weight:600;margin-bottom:4px}
  .sheet-info{font-size:15px;color:var(--sub);margin-bottom:18px}
  .sheet input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:17px;background:var(--card);color:var(--text);outline:none;transition:border-color 0.15s}
  .sheet input::placeholder{color:var(--muted)}
  .sheet input:focus{border-color:var(--accent)}
  .sheet-err{font-size:13px;color:#ef4444;min-height:20px;margin:6px 0 10px}
  .sheet-btns{display:flex;gap:10px}
  .btn{flex:1;padding:14px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--text);transition:all 0.12s;text-align:center}
  .btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .btn:active{transform:scale(0.98)}
  .btn-sub{display:block;font-size:12px;opacity:0.6;margin-top:2px}

  .who-section{padding:20px 16px}
  .who-head-zh{font-size:17px;font-weight:600;color:var(--sub)}
  .who-head-en{font-size:12px;color:var(--muted);margin-bottom:10px}
  .who-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
  .who-card-head{padding:10px 14px;border-bottom:1px solid var(--border)}
  .who-card-zh{font-size:15px;font-weight:600}
  .who-card-en{font-size:12px;color:var(--muted);margin-top:1px}
  .who-row{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .who-row:last-child{border-bottom:none}
  .who-time{font-size:12px;color:var(--sub);flex-shrink:0;line-height:1.5}
  .who-names{color:var(--taken-text);font-weight:600;font-size:14px;text-align:right;word-break:break-word}
  .empty-who{font-size:14px;color:var(--muted);text-align:center;padding:24px 0}

  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:100px;font-size:14px;z-index:200;transition:transform 0.3s;pointer-events:none;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="header-en">Wake — Shift Sign-up</div>
  <div class="header-zh">守灵值班报名</div>
  <div class="header-subs">点击任何时段报名。每小时可多人同时值班。<br>Tap any slot to volunteer. Multiple people welcome per hour.</div>
</header>

<div class="sync-bar">
  <div class="dot loading" id="dot"></div>
  <span id="sync-label">连接中 Connecting…</span>
  <span class="refresh-btn" onclick="doLoad()">刷新 Refresh</span>
</div>

<div class="table-wrap">
  <table id="main-table">
    <thead><tr id="thead-row"><th class="time-col"></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="who-section" id="who-section"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-en">Sign up for shift</div>
    <div class="sheet-zh" id="m-title">报名值班</div>
    <p class="sheet-info" id="m-info"></p>
    <input type="text" id="m-name" placeholder="你的名字 / Your name" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <div class="sheet-err" id="m-err"></div>
    <div class="sheet-btns">
      <button class="btn" onclick="closeModal()">取消<span class="btn-sub">Cancel</span></button>
      <button class="btn btn-primary" onclick="submit()">报名<span class="btn-sub">Sign up</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB='https://peh-fam-default-rtdb.asia-southeast1.firebasedatabase.app/slots';
const DAYS_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_ZH=['周日','周一','周二','周三','周四','周五','周六'];
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_ZH=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// 5 wake days: 18–22 Sep 2026
const WAKE_DATES=[18,19,20,21,22].map(d=>{const x=new Date(2026,8,d);x.setHours(0,0,0,0);return x;});

// Hour order per column: 6am→midnight (same day), then 12am–5am (next calendar day)
const PERIODS=[
  {zh:'早上 6时–12时', en:'Morning 6am–Noon',       hours:[6,7,8,9,10,11],    offset:0},
  {zh:'下午 12时–6时', en:'Afternoon Noon–6pm',      hours:[12,13,14,15,16,17],offset:0},
  {zh:'晚上 6时–午夜', en:'Evening 6pm–Midnight',    hours:[18,19,20,21,22,23],offset:0},
  {zh:'深夜 午夜–6时', en:'Overnight Midnight–6am',  hours:[0,1,2,3,4,5],      offset:1},
];

function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function hEn(h){const ap=h<12?'am':'pm';const hh=h===0?12:h>12?h-12:h;return `${hh}${ap}`}
function hZh(h){if(h===0)return '午夜12时';if(h===12)return '中午12时';return `${h<12?'上午':'下午'}${h>12?h-12:h}时`}
function slotKey(d,h){return `${dayKey(d)}_h${h}`}

let data={};
let pending=null;

async function doLoad(){
  setSyncState('loading','连接中 Connecting…');
  try{
    const r=await fetch(`${DB}.json`);
    if(!r.ok) throw new Error(r.status);
    data=await r.json()||{};
    setSyncState('ok','实时同步 Live');
    render();
  }catch(e){setSyncState('err','连接失败 — 点击刷新 Tap Refresh');console.error(e);}
}

async function doSave(sk,names){
  try{
    await fetch(`${DB}/${sk}.json`,{
      method:names.length?'PUT':'DELETE',
      headers:{'Content-Type':'application/json'},
      body:names.length?JSON.stringify(names):undefined
    });
    setSyncState('ok','已保存 Saved');
  }catch(e){setSyncState('err','保存失败 Save failed');console.error(e);}
}

function setSyncState(state,label){
  document.getElementById('dot').className='dot '+state;
  document.getElementById('sync-label').textContent=label;
}

function render(){
  renderTable();
  renderWho();
}

function renderTable(){
  // Header row
  const thead=document.getElementById('thead-row');
  thead.innerHTML='<th class="time-col" style="border:1px solid var(--border)"></th>';
  WAKE_DATES.forEach(wd=>{
    let count=0;
    PERIODS.forEach(p=>{
      const sd=p.offset?addDays(wd,1):wd;
      p.hours.forEach(h=>{const n=data[slotKey(sd,h)];if(Array.isArray(n))count+=n.length;});
    });
    const th=document.createElement('th');
    th.innerHTML=`<div class="th-zh">${DAYS_ZH[wd.getDay()]}</div><div class="th-en">${DAYS_EN[wd.getDay()]}</div><div class="th-date">${wd.getDate()} ${MONTHS_EN[wd.getMonth()]}</div><div class="th-count">${count?count+'人':''}</div>`;
    thead.appendChild(th);
  });

  // Body
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';

  PERIODS.forEach(p=>{
    // Period header row
    const pr=document.createElement('tr');
    pr.className='period-row';
    const ptd=document.createElement('td');
    ptd.colSpan=6;
    ptd.innerHTML=`<span class="period-zh">${p.zh}</span><span>${p.en}</span>`;
    pr.appendChild(ptd);
    tbody.appendChild(pr);

    // One row per hour
    p.hours.forEach(h=>{
      const tr=document.createElement('tr');
      tr.className='slot-row';

      // Time cell
      const tc=document.createElement('td');
      tc.className='time-cell';
      tc.innerHTML=`<div class="time-zh">${hZh(h)}</div><div class="time-en">${hEn(h)}–${hEn(h===23?0:h+1)}</div>`;
      tr.appendChild(tc);

      // One slot cell per day
      WAKE_DATES.forEach((wd,di)=>{
        const sd=p.offset?addDays(wd,1):wd;
        const sk=slotKey(sd,h);
        const names=Array.isArray(data[sk])?data[sk]:[];
        const td=document.createElement('td');
        td.className='slot-cell'+(names.length?' taken':'');
        if(names.length){
          td.innerHTML=names.map(n=>`<div class="slot-name-row"><span class="slot-name-text">${n}</span><button class="remove-btn" onclick="removeName(event,'${sk}','${n.replace(/'/g,"\\'")}')">✕</button></div>`).join('');
        } else {
          td.innerHTML='<div class="slot-add">＋报名</div>';
        }
        td.onclick=(e)=>{if(e.target.classList.contains('remove-btn'))return;openModal(wd,sd,h,sk);};
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  });
}

function renderWho(){
  const sec=document.getElementById('who-section');
  let html=`<div class="who-head-zh">所有值班人员</div><div class="who-head-en">All volunteers</div>`;
  let any=false;
  WAKE_DATES.forEach(wd=>{
    const rows=[];
    PERIODS.forEach(p=>{
      const sd=p.offset?addDays(wd,1):wd;
      p.hours.forEach(h=>{
        const sk=slotKey(sd,h);
        const names=Array.isArray(data[sk])?data[sk]:[];
        if(names.length){
          rows.push(`<div class="who-row"><span class="who-time">${hZh(h)}<br>${hEn(h)}–${hEn(h===23?0:h+1)}</span><span class="who-names">${names.join(', ')}</span></div>`);
        }
      });
    });
    if(rows.length){
      any=true;
      html+=`<div class="who-card"><div class="who-card-head"><div class="who-card-zh">${DAYS_ZH[wd.getDay()]} ${wd.getDate()}${MONTHS_ZH[wd.getMonth()]}</div><div class="who-card-en">${DAYS_EN[wd.getDay()]}, ${wd.getDate()} ${MONTHS_EN[wd.getMonth()]}</div></div>${rows.join('')}</div>`;
    }
  });
  if(!any) html+='<div class="empty-who">暂无报名 — No volunteers yet.</div>';
  sec.innerHTML=html;
}

function openModal(wd,sd,h,sk){
  pending={sk};
  document.getElementById('m-title').textContent=`${DAYS_ZH[wd.getDay()]} ${wd.getDate()}${MONTHS_ZH[wd.getMonth()]}`;
  document.getElementById('m-info').textContent=`${hZh(h)}　${hEn(h)} – ${hEn(h===23?0:h+1)}`;
  document.getElementById('m-name').value='';
  document.getElementById('m-err').textContent='';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-name').focus(),100);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');pending=null;}

async function submit(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-err').textContent='请输入名字 / Enter your name.';return;}
  const sk=pending.sk;
  const names=Array.isArray(data[sk])?[...data[sk]]:[];
  if(names.includes(name)){document.getElementById('m-err').textContent='你已报名 / Already signed up.';return;}
  names.push(name);
  data[sk]=names;
  closeModal();
  render();
  await doSave(sk,names);
  showToast('报名成功 Signed up!');
  await doLoad();
}

async function removeName(e,sk,name){
  e.stopPropagation();
  const names=(Array.isArray(data[sk])?data[sk]:[]).filter(n=>n!==name);
  data[sk]=names;
  render();
  await doSave(sk,names);
  showToast('已删除 Removed');
  await doLoad();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.getElementById('m-name').addEventListener('keydown',e=>{if(e.key==='Enter')submit();if(e.key==='Escape')closeModal();});

setInterval(doLoad,30000);
doLoad();
</script>
</body>
</html>
