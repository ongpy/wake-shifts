<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>守灵值班报名</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f7f6f4;--card:#ffffff;--border:#e4e2de;
    --text:#1a1916;--sub:#6b6960;--muted:#a09e97;
    --taken:#d4edda;--taken-text:#1a6335;
    --accent:#2563eb;--accent-bg:#eff6ff;--radius:10px;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#141412;--card:#1e1d1b;--border:#2e2d2a;
    --text:#f0ede8;--sub:#8a8880;--muted:#5a5855;
    --taken:#0f2e1a;--taken-text:#6ee09a;
    --accent:#60a5fa;--accent-bg:#1e3a5f;
  }}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;font-size:17px;min-height:100dvh}

  header{padding:20px 16px 14px;border-bottom:1px solid var(--border);background:var(--card)}
  .header-en{font-size:14px;font-weight:500;color:var(--sub)}
  .header-zh{font-size:24px;font-weight:600;letter-spacing:-0.3px;margin:3px 0 6px}
  .header-sub{font-size:14px;color:var(--sub);line-height:1.5}
  .header-sub-zh{font-size:15px;color:var(--sub);margin-top:2px;line-height:1.5}

  .sync-bar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s}
  .dot.ok{background:#22c55e}.dot.err{background:#ef4444}.dot.loading{background:#f59e0b;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .refresh-btn{margin-left:auto;cursor:pointer;font-size:14px;color:var(--accent)}

  .days-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .days-grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));min-width:700px;border-bottom:1px solid var(--border)}
  .day-col{border-right:1px solid var(--border)}
  .day-col:last-child{border-right:none}
  .day-header{padding:10px 4px 8px;text-align:center;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .day-en{font-size:12px;color:var(--muted);font-weight:500}
  .day-zh{font-size:14px;color:var(--sub);margin-top:1px;font-weight:500}
  .day-date{font-size:16px;font-weight:700;margin-top:2px}
  .day-count{font-size:12px;color:var(--muted);margin-top:3px;min-height:15px}

  .slots{display:flex;flex-direction:column}
  .period-label{padding:7px 6px 4px;background:var(--bg);border-bottom:1px solid var(--border)}
  .period-zh{font-size:13px;color:var(--sub);font-weight:600}
  .period-en{font-size:11px;color:var(--muted);margin-top:1px}

  .slot{border-bottom:1px solid var(--border);min-height:56px;display:flex;flex-direction:column;justify-content:center;padding:8px 8px;cursor:pointer;background:var(--card);transition:background 0.12s;-webkit-user-select:none;user-select:none}
  .slot:active{background:var(--accent-bg)}
  .slot.taken{background:var(--taken)}
  .slot-time{font-size:12px;color:var(--muted);line-height:1.4;font-weight:500;white-space:nowrap}
  .slot-names{margin-top:4px}
  .slot-name-row{display:flex;align-items:center;gap:4px;margin-top:2px}
  .slot-name-row:first-child{margin-top:0}
  .slot-name-text{font-size:12px;color:var(--taken-text);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot-add{font-size:11px;color:var(--muted);margin-top:2px}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  @media(min-width:480px){.overlay{align-items:center}}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:24px 24px 40px;width:100%;max-width:480px}
  @media(min-width:480px){.sheet{border-radius:20px;padding:28px}}
  .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 20px}
  @media(min-width:480px){.sheet-handle{display:none}}
  .sheet-en{font-size:14px;color:var(--sub);margin-bottom:3px}
  .sheet-zh{font-size:22px;font-weight:600;margin-bottom:6px}
  .sheet-info{font-size:16px;color:var(--sub);margin-bottom:20px}
  .sheet input{width:100%;padding:16px;border:2px solid var(--border);border-radius:var(--radius);font-size:18px;background:var(--card);color:var(--text);outline:none;transition:border-color 0.15s}
  .sheet input::placeholder{color:var(--muted)}
  .sheet input:focus{border-color:var(--accent)}
  .sheet-err{font-size:14px;color:#ef4444;min-height:20px;margin:8px 0 12px}
  .sheet-btns{display:flex;gap:10px}
  .btn{flex:1;padding:16px;border-radius:var(--radius);font-size:17px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--text);transition:all 0.12s;line-height:1.3;text-align:center}
  .btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .btn:active{transform:scale(0.98)}
  .btn-sub{display:block;font-size:13px;opacity:0.6;margin-top:2px}

  .who-section{padding:20px 16px}
  .who-head{margin-bottom:12px}
  .who-head-en{font-size:13px;color:var(--muted)}
  .who-head-zh{font-size:18px;font-weight:600;color:var(--sub);margin-top:2px}
  .who-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .who-card-head{padding:12px 14px}
  .who-card-en{font-size:13px;color:var(--muted)}
  .who-card-zh{font-size:16px;font-weight:600;margin-top:1px}
  .who-row{padding:10px 14px;border-top:1px solid var(--border);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .who-time{color:var(--sub);font-size:13px;flex-shrink:0;line-height:1.5}
  .who-names{color:var(--taken-text);font-weight:600;word-break:break-word;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .empty-who{font-size:15px;color:var(--muted);text-align:center;padding:28px 0}
  .empty-zh{font-size:17px;color:var(--sub);margin-bottom:6px;font-weight:500}

  .remove-btn{flex-shrink:0;font-size:11px;color:#ef4444;cursor:pointer;padding:1px 5px;border-radius:4px;border:1px solid #ef4444;background:none;line-height:1.5;opacity:0.8;white-space:nowrap}
  .remove-btn:active{opacity:1}
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:14px 24px;border-radius:100px;font-size:15px;z-index:200;transition:transform 0.3s;pointer-events:none;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="header-en">Wake — Shift Sign-up</div>
  <div class="header-zh">守灵值班报名</div>
  <div class="header-sub-zh">点击任何时段报名。每小时可多人同时值班。</div>
  <div class="header-sub">Tap any slot to volunteer. Multiple people welcome per hour.</div>
</header>

<div class="sync-bar">
  <div class="dot loading" id="dot"></div>
  <span id="sync-label">连接中 Connecting…</span>
  <span class="refresh-btn" onclick="doLoad()">刷新 Refresh</span>
</div>

<div class="days-scroll">
  <div class="days-grid" id="days-grid"></div>
</div>

<div class="who-section" id="who-section"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-en">Sign up for shift</div>
    <div class="sheet-zh" id="m-title">报名值班</div>
    <p class="sheet-info" id="m-info"></p>
    <input type="text" id="m-name" placeholder="你的名字 / Your name" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <div class="sheet-err" id="m-err"></div>
    <div class="sheet-btns">
      <button class="btn" onclick="closeModal()">取消<span class="btn-sub">Cancel</span></button>
      <button class="btn btn-primary" onclick="submit()">报名<span class="btn-sub">Sign up</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB = 'https://peh-fam-default-rtdb.asia-southeast1.firebasedatabase.app/slots';

const DAYS_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_ZH = ['周日','周一','周二','周三','周四','周五','周六'];
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_ZH = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// Each period: hours are real clock hours, storeDayOffset=1 means store under NEXT calendar day
// Column for day D shows:
//   Morning   6–11  → stored under day D
//   Afternoon 12–17 → stored under day D
//   Evening   18–23 → stored under day D
//   Overnight  0–5  → stored under day D+1 (it IS the next calendar day)
const PERIODS = [
  {en:'Morning 6am–Noon',       zh:'早上 6时–12时',   hours:[6,7,8,9,10,11],          offset:0},
  {en:'Afternoon Noon–6pm',     zh:'下午 12时–6时',   hours:[12,13,14,15,16,17],       offset:0},
  {en:'Evening 6pm–Midnight',   zh:'晚上 6时–午夜',   hours:[18,19,20,21,22,23],       offset:0},
  {en:'Overnight Midnight–6am', zh:'深夜 午夜–早上6时',hours:[0,1,2,3,4,5],            offset:1},
];

// The 5 "wake days" — each column header shows this date
// But overnight slots in column D are stored under D+1
const WAKE_DATES = [18,19,20,21,22].map(day=>{
  const d=new Date(2026,8,day); // Sep is month 8 (0-indexed)
  d.setHours(0,0,0,0);
  return d;
});

function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function hEn(h){const ap=h<12?'am':'pm';const hh=h===0?12:h>12?h-12:h;return `${hh}${ap}`}
function hZh(h){if(h===0)return '午夜12时';if(h===12)return '中午12时';return `${h<12?'上午':'下午'}${h>12?h-12:h}时`}
// slotKey: always uses the actual calendar date the hour belongs to
function slotKey(d, h){return `${dayKey(d)}_h${h}`}

let data={};
let pending=null;

async function doLoad(){
  setSyncState('loading','连接中 Connecting…');
  try{
    const r=await fetch(`${DB}.json`);
    if(!r.ok) throw new Error(r.status);
    const json=await r.json();
    data=json||{};
    setSyncState('ok','实时同步 Live');
    render();
  }catch(e){
    setSyncState('err','连接失败，点击刷新 — tap Refresh');
    console.error(e);
  }
}

async function doSave(sk, names){
  setSyncState('loading','保存中 Saving…');
  try{
    const r=await fetch(`${DB}/${sk}.json`,{
      method: names.length?'PUT':'DELETE',
      headers:{'Content-Type':'application/json'},
      body: names.length?JSON.stringify(names):undefined
    });
    if(!r.ok) throw new Error(r.status);
    setSyncState('ok','已保存 Saved');
  }catch(e){
    setSyncState('err','保存失败 Save failed');
    console.error(e);
  }
}

function setSyncState(state,label){
  document.getElementById('dot').className='dot '+state;
  document.getElementById('sync-label').textContent=label;
}

function render(){renderGrid();renderWho();}

function renderGrid(){
  const grid=document.getElementById('days-grid');
  grid.innerHTML='';
  WAKE_DATES.forEach((wakeDay, di)=>{
    const col=document.createElement('div');
    col.className='day-col';
    // Count all slots for this column (morning/afternoon/evening under wakeDay, overnight under wakeDay+1)
    let count=0;
    PERIODS.forEach(p=>{
      const storeDay = p.offset===1 ? addDays(wakeDay,1) : wakeDay;
      p.hours.forEach(h=>{
        const sk=slotKey(storeDay,h);
        const n=data[sk];
        if(Array.isArray(n)) count+=n.length;
      });
    });
    col.innerHTML=`
      <div class="day-header">
        <div class="day-zh">${DAYS_ZH[wakeDay.getDay()]}</div>
        <div class="day-en">${DAYS_EN[wakeDay.getDay()]}</div>
        <div class="day-date">${wakeDay.getDate()} ${MONTHS_EN[wakeDay.getMonth()]}</div>
        <div class="day-count">${count?count+'人':''}</div>
      </div>
      <div class="slots" id="slots-${di}"></div>`;
    grid.appendChild(col);

    const slotsEl=col.querySelector(`#slots-${di}`);
    PERIODS.forEach(p=>{
      const storeDay = p.offset===1 ? addDays(wakeDay,1) : wakeDay;
      const pl=document.createElement('div');
      pl.className='period-label';
      pl.innerHTML=`<div class="period-zh">${p.zh}</div><div class="period-en">${p.en}</div>`;
      slotsEl.appendChild(pl);
      p.hours.forEach(h=>{
        const sk=slotKey(storeDay,h);
        const names=Array.isArray(data[sk])?data[sk]:[];
        const el=document.createElement('div');
        el.className='slot'+(names.length?' taken':'');
        const nameTags=names.map(n=>`<div class="slot-name-row"><span class="slot-name-text">${n}</span><button class="remove-btn" onclick="removeName(event,'${sk}','${n.replace(/'/g,"\\'")}')">✕ 删除</button></div>`).join('');
        el.innerHTML=`<div class="slot-time">${hZh(h)}<br>${hEn(h)}–${hEn(h===23?0:h+1)}</div>${names.length?`<div class="slot-names">${nameTags}</div>`:'<div class="slot-add">＋报名</div>'}`;
        el.onclick=(()=>{const _sk=sk;const _sd=storeDay;const _h=h;const _wd=wakeDay;return()=>openModal(_wd,_sd,_h,_sk);})();
        slotsEl.appendChild(el);
      });
    });
  });
}

function renderWho(){
  const sec=document.getElementById('who-section');
  let html=`<div class="who-head"><div class="who-head-zh">所有值班人员</div><div class="who-head-en">All volunteers</div></div>`;
  let any=false;
  WAKE_DATES.forEach((wakeDay)=>{
    const rows=[];
    PERIODS.forEach(p=>{
      const storeDay = p.offset===1 ? addDays(wakeDay,1) : wakeDay;
      p.hours.forEach(h=>{
        const sk=slotKey(storeDay,h);
        const names=Array.isArray(data[sk])?data[sk]:[];
        if(names.length){
          const nameTags=names.map(n=>`<span style="display:flex;align-items:center;gap:6px;margin-top:3px"><span style="flex:1">${n}</span><button class="remove-btn" onclick="removeName(event,'${sk}','${n.replace(/'/g,"\\'")}')">✕</button></span>`).join('');
          rows.push(`<div class="who-row"><span class="who-time">${hZh(h)}<br>${hEn(h)}–${hEn(h===23?0:h+1)}</span><span class="who-names">${nameTags}</span></div>`);
        }
      });
    });
    if(rows.length){
      any=true;
      html+=`<div class="who-card"><div class="who-card-head"><div class="who-card-zh">${DAYS_ZH[wakeDay.getDay()]} ${wakeDay.getDate()}${MONTHS_ZH[wakeDay.getMonth()]}</div><div class="who-card-en">${DAYS_EN[wakeDay.getDay()]}, ${wakeDay.getDate()} ${MONTHS_EN[wakeDay.getMonth()]}</div></div>${rows.join('')}</div>`;
    }
  });
  if(!any) html+=`<div class="empty-who"><div class="empty-zh">暂无报名</div>No volunteers yet — be the first.</div>`;
  sec.innerHTML=html;
}

function openModal(wakeDay, storeDay, h, sk){
  pending={sk};
  document.getElementById('m-title').textContent=`${DAYS_ZH[wakeDay.getDay()]} ${wakeDay.getDate()}${MONTHS_ZH[wakeDay.getMonth()]}`;
  document.getElementById('m-info').textContent=`${hZh(h)}　${hEn(h)} – ${hEn(h===23?0:h+1)}`;
  document.getElementById('m-name').value='';
  document.getElementById('m-err').textContent='';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-name').focus(),100);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');pending=null;}

async function submit(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-err').textContent='请输入名字 / Enter your name.';return;}
  const sk=pending.sk;
  const names=Array.isArray(data[sk])?[...data[sk]]:[];
  if(names.includes(name)){document.getElementById('m-err').textContent='你已报名 / Already signed up.';return;}
  names.push(name);
  data[sk]=names;
  closeModal();
  render();
  await doSave(sk,names);
  showToast('报名成功 Signed up!');
  await doLoad();
}

async function removeName(e,sk,name){
  e.stopPropagation();
  const names=Array.isArray(data[sk])?data[sk]:[];
  const updated=names.filter(n=>n!==name);
  data[sk]=updated;
  render();
  await doSave(sk,updated);
  showToast('已删除 Removed');
  await doLoad();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.getElementById('m-name').addEventListener('keydown',e=>{if(e.key==='Enter')submit();if(e.key==='Escape')closeModal();});

setInterval(doLoad,30000);
doLoad();
</script>
</body>
</html>
